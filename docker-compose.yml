services:
  # MySQL Database
  mysql:
    image: mysql:9.1.0
    container_name: looping-mysql
    restart: unless-stopped
    tty: true
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: looping
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-6bhcct53}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - looping-network
    command: --lower-case-table-names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Link: localhost:3308

  # MongoDB Database
  mongodb:
    image: mongo:8.2
    container_name: looping-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 6bhcct53
      MONGO_INITDB_DATABASE: looping
    volumes:
      - mongo_data:/data/db
    networks:
      - looping-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://admin:6bhcct53@localhost:27017/admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    # Link: localhost:27018

  # Laravel Server (PHP-FPM)
  laravel:
    build:
      context: ./looping-server
      dockerfile: ../docker/laravel/Dockerfile
    container_name: looping-laravel
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./looping-server:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - looping-network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Link: (Internal via Nginx on 8888)

  # Nginx Proxy for Laravel
  nginx:
    image: nginx:alpine
    container_name: looping-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./looping-server:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      laravel:
        condition: service_started
    networks:
      - looping-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Link: http://localhost:8888 (Backend)

  # React Client
  react:
    build:
      context: ./looping-client
      dockerfile: ../docker/react/Dockerfile
    container_name: looping-react
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./looping-client:/app
      - /app/node_modules
    networks:
      - looping-network
    # Link: http://localhost:3002 (Frontend)

  # Node SSR
  ssr:
    build:
      context: ./looping-ssr
      dockerfile: ../docker/node/Dockerfile
    container_name: looping-ssr
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      - LARAVEL_URL=http://nginx
    volumes:
      - ./looping-ssr:/app
      - /app/node_modules
    depends_on:
      - laravel
      - nginx
    networks:
      - looping-network
    # Link: http://localhost:3003 (SSR System)

volumes:
  mysql_data:
  mongo_data:

networks:
  looping-network:
    driver: bridge
