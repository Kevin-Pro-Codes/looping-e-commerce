[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=payments.high_priority --sleep=1 --max-time=3600 --memory=128
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-high.log
stopwaitsecs=3600

[program:queue-normal]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=payments.normal_priority --sleep=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-normal.log
stopwaitsecs=3600

[program:queue-low]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=payments.low_priority,stock.sync,notifications.email --sleep=5 --max-time=3600 --memory=256
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-low.log
stopwaitsecs=3600
