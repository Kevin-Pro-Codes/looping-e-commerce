spring.application.name=server

# DATABASE - SEM SENHA ✅
spring.datasource.url=jdbc:mysql://localhost:3306/finito
spring.datasource.username=root
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Stripe Configuration
stripe.secret-key=sk_test_your_secret_key_here
stripe.publishable-key=pk_test_your_publishable_key_here
stripe.webhook-secret=whsec_your_webhook_secret_here

# Server Configuration
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:3000